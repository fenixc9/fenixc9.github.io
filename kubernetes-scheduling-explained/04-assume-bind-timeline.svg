<text x="405.0" y="608" font-size="17" text-anchor="middle" class="">Bind 响应：可能超时</text>
<path d="M685,680 L405,680" fill="none" stroke="#52746b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="413" y="646" width="264" height="29" rx="2" fill="#f5f8f6" stroke="#f5f8f6" stroke-width="2"/>
<text x="545.0" y="668" font-size="17" text-anchor="middle" class="">Informer：正式对象确认</text>
<text x="45" y="735" font-size="22" text-anchor="start" class="title">响应与 Watch 事件的相对顺序不固定；Bind 超时不等于写入失败。</text>

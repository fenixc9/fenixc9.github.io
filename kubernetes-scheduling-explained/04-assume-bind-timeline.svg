<path d="M685,500 L965,500" fill="none" stroke="#52746b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="693" y="466" width="264" height="29" rx="2" fill="#f5f8f6" stroke="#f5f8f6" stroke-width="2"/>
<text x="825.0" y="488" font-size="17" text-anchor="middle" class="">持久化 Pod.nodeName</text>

<text x="44" y="55" font-size="32" text-anchor="start" class="title">Assume 与 Bind：本地预占和正式写入</text>
<text x="44" y="90" font-size="18" text-anchor="start" class="muted">本地缓存、API 存储和事件观察之间存在时间窗口。</text>

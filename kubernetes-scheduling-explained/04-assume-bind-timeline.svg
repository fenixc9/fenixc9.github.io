<text x="265.0" y="243" font-size="17" text-anchor="middle" class="">AssumePod：本地预占</text>
<text x="405" y="290" font-size="17" text-anchor="middle" class="">副本 nodeName = X</text>
<text x="125" y="350" font-size="17" text-anchor="middle" class="">Reserve / Permit</text>
<text x="125" y="380" font-size="17" text-anchor="middle" class="">PreBind</text>

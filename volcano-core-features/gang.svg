<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t"><title id="t">Gang 调度最小成员数示例</title><rect width="900" height="300" fill="#f7fafb"/><g font-family="sans-serif" fill="#172b38" text-anchor="middle"><text x="450" y="36" font-size="22">4 个 Worker，minAvailable = 4</text><text x="230" y="78" font-size="19">只有 3 个可用位置</text><text x="670" y="78" font-size="19">4 个位置均可分配</text><g fill="#fce9e5" stroke="#bd6250" stroke-width="2"><rect x="55" y="100" width="350" height="115" rx="8"/></g><g fill="#e3f3ed" stroke="#24805e" stroke-width="2"><rect x="495" y="100" width="350" height="115" rx="8"/></g><g font-size="36"><text x="230" y="158">● ● ● ○</text><text x="670" y="158">● ● ● ●</text></g><g font-size="17"><text x="230" y="192">不提交这组分配</text><text x="670" y="192">满足最小成员约束，提交分配</text><text x="450" y="265">调度成功不等于容器已经启动或应用已经就绪</text></g></g></svg>

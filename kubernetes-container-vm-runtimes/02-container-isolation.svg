<text x="44" y="55" font-size="32" text-anchor="start" class="title">三种容器执行路径，隔离边界不同</text>
<text x="44" y="90" font-size="18" text-anchor="start" class="muted">普通容器共享节点内核；gVisor 实现系统接口；Kata 使用 guest kernel。</text>
<rect x="45" y="140" width="300" height="65" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>

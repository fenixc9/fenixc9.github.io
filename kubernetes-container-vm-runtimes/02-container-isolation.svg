<rect x="420" y="450" width="260" height="80" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>
<text x="550.0" y="485" font-size="23" text-anchor="middle" class="title">宿主受限接口</text>
<path d="M905,340 L905,365" fill="none" stroke="#52746b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="775" y="365" width="260" height="70" rx="14" fill="#ffecd0" stroke="#b9cec5" stroke-width="2"/>
<text x="905.0" y="400" font-size="23" text-anchor="middle" class="title">guest kernel</text>
<path d="M905,435 L905,450" fill="none" stroke="#52746b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="775" y="450" width="260" height="80" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>

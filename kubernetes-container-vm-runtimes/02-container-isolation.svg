<rect x="755" y="140" width="300" height="65" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>
<text x="905.0" y="175" font-size="23" text-anchor="middle" class="title">Kata</text>
<rect x="45" y="245" width="300" height="310" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>
<rect x="400" y="245" width="300" height="310" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>
<rect x="755" y="245" width="300" height="310" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>
<rect x="65" y="265" width="260" height="75" rx="14" fill="#e7f1eb" stroke="#b9cec5" stroke-width="2"/>
<text x="195.0" y="300" font-size="23" text-anchor="middle" class="title">应用进程</text>
<rect x="420" y="265" width="260" height="75" rx="14" fill="#e7f1eb" stroke="#b9cec5" stroke-width="2"/>
<text x="550.0" y="300" font-size="23" text-anchor="middle" class="title">应用进程</text>
<rect x="775" y="265" width="260" height="75" rx="14" fill="#e7f1eb" stroke="#b9cec5" stroke-width="2"/>
<text x="905.0" y="300" font-size="23" text-anchor="middle" class="title">容器进程</text>
<path d="M195,340 L195,450" fill="none" stroke="#52746b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="65" y="450" width="260" height="80" rx="14" fill="#ffffff" stroke="#b9cec5" stroke-width="2"/>
<text x="195.0" y="485" font-size="23" text-anchor="middle" class="title">节点 Linux 内核</text>
<path d="M550,340 L550,365" fill="none" stroke="#52746b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="420" y="365" width="260" height="70" rx="14" fill="#ffecd0" stroke="#b9cec5" stroke-width="2"/>

<rect x="45" y="605" width="1010" height="75" rx="14" fill="#e7f1eb" stroke="#b9cec5" stroke-width="2"/>
<text x="70" y="637" font-size="22" text-anchor="start" class="title">更换隔离路径后，需要重新验证 ABI、I/O、设备支持与诊断方式。</text>
<text x="70" y="666" font-size="20" text-anchor="start" class="">安全边界与性能成本必须按实际配置分析，不能只按项目名称排序。</text>
<text x="44" y="711" font-size="15" text-anchor="start" class="muted">ByteDrift · 资料截至 2026-10-26 · 概念示意，省略部分集成组件</text>
